name: CI

# Runs the four checks AGENTS.md requires before any change is considered done,
# plus a docs build. Everything here is offline: tests use wiremock, never the
# live Alpaca API, so no credentials are needed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test, doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Edition 2024 requires Rust 1.85 or newer; stable satisfies that.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Doc tests
        run: cargo test --doc

      - name: Build docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

  locked-build:
    name: build with committed lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Catches manifest/lockfile drift, which a normal build would silently
      # paper over by updating Cargo.lock.
      - name: Build
        run: cargo build --locked --all-targets
