name: Security audit

# Scans dependencies for known RustSec advisories. Runs on dependency changes
# and weekly, since new advisories are published against existing lockfiles.
on:
  push:
    branches: [main]
    paths: [Cargo.toml, Cargo.lock]
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
