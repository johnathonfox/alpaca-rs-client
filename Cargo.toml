[package]
# Published as `alpaca-rs-client` because `alpaca-rs` was already taken on
# crates.io by an unrelated crate.
name = "alpaca-rs-client"
version = "0.1.1"
edition = "2024"
description = "Async Rust client for the Alpaca trading and market data APIs (REST + WebSocket), with alpaca-py parity"
license = "MIT OR Apache-2.0"
repository = "https://github.com/johnathonfox/alpaca-rs-client"
keywords = ["alpaca", "trading", "stocks", "market-data", "finance"]
categories = ["api-bindings", "finance"]

[lib]
name = "alpaca_rs_client"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3.33"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "query"] }
rust_decimal = { version = "1.42.1", features = ["serde-str"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
wiremock = "0.6.5"
